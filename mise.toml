[tools]
hk = "2.0.1"
gitleaks = "v8.18.4"
"go:github.com/google/addlicense" = "v1.2.0"
trivy = "v0.74.0"
helm = "v3.14.0"
actionlint = "latest"
shellcheck = "latest"
zizmor = "latest"

[tasks.install]
description = "Install tools, hook up hooks, and prepare environment"
run = """
hk install
"""

[tasks.compose]
description = "Run Docker Compose for local lab"
run = """
docker compose up -d
"""

[tasks.down]
description = "Stop Docker Compose"
run = """
docker compose down
"""

[tasks.logs]
description = "View Docker Compose logs"
run = """
docker compose logs -f
"""

[tasks.hk]
description = "Run hk checks on all files"
run = """
hk check --all
"""

[tasks.helm-lint]
description = "Lint all Helm charts in charts directory"
run = """
find charts -name "Chart.yaml" -exec dirname {} + | xargs helm lint
"""

[tasks.trivy-fs]
description = "Run Trivy on the file system"
run = """
trivy fs .
"""
